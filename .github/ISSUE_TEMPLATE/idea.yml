name: Suggest a Feature
description: An idea that would make RestinPID better.
labels: [enhancement]
body:
  - type: textarea
    id: details
    attributes:
      label: What would you like, and why?
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Versions
      description: Filled in by the app's Send Feedback window, or from About RestinPID.
      placeholder: RestinPID 3.7 (11) · macOS 15.1 · Apple silicon
